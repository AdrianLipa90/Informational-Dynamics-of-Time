name: Reference suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run full reference suite
        run: python -m pytest -q tests/reference
