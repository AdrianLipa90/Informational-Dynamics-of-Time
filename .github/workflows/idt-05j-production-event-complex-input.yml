name: IDT 05J production event-complex input

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idt-05j:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 05J reference dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Run IDT 05J production event-complex input controls
        run: python -m pytest -q tests/reference/test_production_event_complex_input.py
